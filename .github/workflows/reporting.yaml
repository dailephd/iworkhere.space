name: Reporting MCP
on:
  pull_request:
  push:
    branches: [main, master, "validation/**"]
jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reporting/package-lock.json
      - run: npm --prefix reporting ci
      - run: npm --prefix reporting run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-test-report
          path: reporting/test-report/
          retention-days: 30
