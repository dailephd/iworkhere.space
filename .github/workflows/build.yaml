name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "validation/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
