name: Durable observability health collector
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observability-health-production
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'dailephd/iworkhere.space' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: observability-health
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project-contained storage
        run: |
          mkdir -p .my-dev-kit-workflow/tmp .my-dev-kit-workflow/npm-cache
          echo "TMPDIR=$GITHUB_WORKSPACE/.my-dev-kit-workflow/tmp" >> "$GITHUB_ENV"
          echo "npm_config_cache=$GITHUB_WORKSPACE/.my-dev-kit-workflow/npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - name: Collect bounded independent evidence
        working-directory: dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_HEALTH_COLLECTION_TOKEN }}
          OBSERVABILITY_HEALTH_COLLECTOR_DATABASE_URL: ${{ secrets.OBSERVABILITY_HEALTH_COLLECTOR_DATABASE_URL }}
        run: node --import tsx script/healthCollect.ts
