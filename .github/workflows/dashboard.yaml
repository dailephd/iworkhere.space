name: Dashboard
on:
  pull_request:
  push:
    branches: [main, master, "validation/**"]
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-test-report
          path: dashboard/test-report/
          retention-days: 30
