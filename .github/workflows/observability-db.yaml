name: Observability database
on:
  pull_request:
  push:
    branches: [main, master, "validation/**"]
jobs:
  observability-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:observability-db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observability-db-report
          path: test-report/observability-db-*/
          retention-days: 30
