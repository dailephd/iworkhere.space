name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "validation/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test --if-present

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report/
          retention-days: 30
